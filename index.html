<!DOCTYPE html>
<html>
<head>
<title>Cookie Omniverse Online</title>
</head>

<body style="margin:0;font-family:Arial;text-align:center;background:#000;color:#0f0;overflow:hidden">

<h1 id="title">🌍 COOKIE OMNIVERSE ONLINE</h1>

<h2>
PLAYER: YOU |
RANK: <span id="rank">NOVICE COOKIE</span>
</h2>

<h3>
SCORE: <span id="score">0</span> |
WORLD: <span id="world">1</span> |
BOSS HP: <span id="boss">100</span>
</h3>

<button id="cookie"
onclick="hit()"
style="font-size:80px;padding:20px;border-radius:20px;margin-top:20px">
🍪
</button>

<br><br>

<button onclick="upgrade()">Upgrade 🛠</button>
<button onclick="reset()">Reset Universe 💾</button>

<h3>🌍 GLOBAL LEADERBOARD (FAKE)</h3>
<div id="board"></div>

<script>
let score = 0
let world = 1
let boss = 100
let power = 1
let evolution = 0

let ranks = [
  "NOVICE COOKIE",
  "BAKERY KNIGHT",
  "COOKIE WIZARD",
  "COOKIE GOD",
  "OMNIVERSE BREAKER"
]

let fakePlayers = [
  {name:"Alex",score:1200},
  {name:"Mia",score:980},
  {name:"Zed",score:760},
  {name:"You",score:0}
]

function hit(){
  let dmg = power * (Math.random()<0.2 ? 5 : 1)

  score += dmg
  boss -= dmg

  if(boss <= 0){
    world++
    boss = 100 + world*20
    evolution++
    storyEvent()
  }

  update()
  renderBoard()
  evolve()
}

function upgrade(){
  power++
  story("🛠 Power upgraded!")
}

function evolve(){
  if(score > 50) document.getElementById("cookie").innerText = "🍪"
if(score > 100) document.getElementById("cookie").innerText = "🍧"
  if(score > 200) document.getElementById("cookie").innerText = "🍩"
  if(score > 500) document.getElementById("cookie").innerText = "🔥 COOKIE"
}

function storyEvent(){
  let events = [
    "🌌 A new universe has opened...",
    "👁 The cookie gods are watching...",
    "⚠ Reality shifts again...",
    "🧬 Your cookie evolves..."
  ]
  story(events[Math.floor(Math.random()*events.length)])
}

function story(msg){
  setTimeout(()=>alert(msg),100)
}

function reset(){
  score = 0
  world = 1
  boss = 100
  power = 1
  evolution = 0
  story("🔁 Universe reset!")
  update()
}

function update(){
  document.getElementById("score").innerText = score
  document.getElementById("world").innerText = world
  document.getElementById("boss").innerText = boss

  let rankIndex = Math.min(ranks.length-1, Math.floor(score/200))
  document.getElementById("rank").innerText = ranks[rankIndex]
}

function renderBoard(){
  fakePlayers[3].score = score
  fakePlayers.sort((a,b)=>b.score-a.score)

  document.getElementById("board").innerHTML =
    fakePlayers.map(p=>`<div>${p.name} - ${p.score}</div>`).join("")
}

// boss becomes smarter 😈
setInterval(()=>{
  if(boss > 0){
    score = Math.max(0, score - world)
    update()
  }
},2000)

renderBoard()
update()
</script>

</body>
</html>
