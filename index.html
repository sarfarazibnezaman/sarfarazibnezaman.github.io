
<!DOCTYPE html>
<html>
<head>
<title>Cookie Omniverse Online</title>
</head>

<body style="margin:0;font-family:Arial;text-align:center;background:#000;color:#0f0;overflow:hidden">

<h1>🌍 COOKIE OMNIVERSE ONLINE</h1>

<h2>
PLAYER: YOU |
RANK: <span id="rank">NOVICE COOKIE</span>
</h2>

<h3>
SCORE: <span id="score">0</span> |
WORLD: <span id="world">1</span> |
BOSS HP: <span id="boss">100</span> |
👍 LIKES: <span id="likes">0</span>
</h3>

<button id="cookie"
onclick="hit()"
style="
font-size:80px;
padding:20px;
border-radius:20px;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
transition:all 0.3s ease;
z-index:100;
">
🍪
</button>

<br><br>

<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);">
<button onclick="upgrade()">Upgrade 🛠</button>
<button onclick="like()">👍 Like</button>
<button onclick="reset()">Reset Universe 💾</button>

<h3>🌍 GLOBAL LEADERBOARD (FAKE)</h3>
<div id="board"></div>
</div>

<script>
let score = 0
let world = 1
let boss = 100
let power = 1
let likes = 0

let ranks = [
  "NOVICE COOKIE",
  "BAKERY KNIGHT",
  "COOKIE WIZARD",
  "COOKIE GOD",
  "OMNIVERSE BREAKER"
]

let fakePlayers = [
  {name:"Alex",score:1200},
  {name:"Mia",score:980},
  {name:"Zed",score:760},
  {name:"You",score:0}
]

function moveCookie(){
  const cookie = document.getElementById("cookie")

  const maxX = window.innerWidth - 180
  const maxY = window.innerHeight - 180

  const x = Math.random() * maxX
  const y = Math.random() * maxY

  cookie.style.left = x + "px"
  cookie.style.top = y + "px"
}

function hit(){
  let dmg = power * (Math.random() < 0.2 ? 5 : 1)
  dmg += Math.floor(likes / 10)

  score += dmg
  boss -= dmg

  let c = document.getElementById("cookie")
  c.style.transform = "scale(0.8)"

  setTimeout(() => {
    c.style.transform = "scale(1)"
  }, 80)

  moveCookie()

  if(boss <= 0){
    world++
    boss = 100 + world * 20
    storyEvent()
  }

  update()
  renderBoard()
  evolve()
}

function upgrade(){
  power++
  story("🛠 Power upgraded!")
}

function like(){
  likes++
  document.getElementById("likes").innerText = likes
  story("👍 Cookie universe liked!")
}

function evolve(){
  let cookie = document.getElementById("cookie")

  if(score > 50) cookie.innerText = "🍪"
  if(score > 100) cookie.innerText = "🍧"
  if(score > 200) cookie.innerText = "🍩"
  if(score > 350) cookie.innerText = "🍫"
  if(score > 500) cookie.innerText = "🔥"
  if(score > 800) cookie.innerText = "⚡"
  if(score > 1200) cookie.innerText = "🌌"
  if(score > 2000) cookie.innerText = "👑"
}

function storyEvent(){
  let events = [
    "🌌 A new universe opens...",
    "👁 Cookie gods are watching...",
    "⚠ Reality shifts...",
    "🧬 You evolve beyond cookies..."
  ]

  story(events[Math.floor(Math.random()*events.length)])
}

function story(msg){
  setTimeout(() => alert(msg), 100)
}

function reset(){
  score = 0
  world = 1
  boss = 100
  power = 1
  likes = 0

  document.getElementById("cookie").innerText = "🍪"

  story("🔁 Universe reset!")
  update()
  renderBoard()
}

function update(){
  document.getElementById("score").innerText = Math.floor(score)
  document.getElementById("world").innerText = world
  document.getElementById("boss").innerText = Math.max(0, Math.floor(boss))
  document.getElementById("likes").innerText = likes

  let rankIndex = Math.min(
    ranks.length - 1,
    Math.floor(score / 200)
  )

  document.getElementById("rank").innerText = ranks[rankIndex]
}

function renderBoard(){
  fakePlayers[3].score = Math.floor(score)

  fakePlayers.sort((a,b) => b.score - a.score)

  document.getElementById("board").innerHTML =
    fakePlayers.map(
      p => `<div>${p.name} - ${p.score}</div>`
    ).join("")
}

setInterval(() => {
  if(boss > 0){
    score = Math.max(0, score - world)
    update()
  }
}, 2000)

renderBoard()
update()
</script>

</body>
</html>
